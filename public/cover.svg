<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#120a1f"/>
      <stop offset="55%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#2a1a4a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#base)"/>

  <!-- faint diagonal accent lines, sports-editorial style -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <line x1="700" y1="0" x2="1000" y2="600"/>
    <line x1="800" y1="0" x2="1100" y2="600"/>
    <line x1="900" y1="0" x2="1200" y2="600"/>
  </g>

  <!-- large faint crest watermark, right side -->
  <g transform="translate(950,300)" opacity="0.08">
    <circle r="230" fill="none" stroke="#e8b923" stroke-width="6"/>
    <rect x="-28" y="-110" width="56" height="220" rx="14" fill="#e8b923"/>
    <rect x="-95" y="-45" width="190" height="56" rx="14" fill="#e8b923"/>
  </g>

  <!-- subtle scattered dots -->
  <g fill="#e8b923" opacity="0.25">
    <circle cx="640" cy="120" r="3"/>
    <circle cx="720" cy="480" r="3"/>
    <circle cx="1050" cy="150" r="3"/>
    <circle cx="1120" cy="440" r="3"/>
    <circle cx="820" cy="90" r="3"/>
  </g>
</svg>
